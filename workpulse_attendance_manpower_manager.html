    // Live Punch Timer
    let punchTimerInterval = null;
    function startPunchTimer() {
      if (punchTimerInterval) clearInterval(punchTimerInterval);
      punchTimerInterval = setInterval(() => {
        if (AppState.todayPunch.punchedIn && AppState.todayPunch.isTimerRunning) {
          AppState.todayPunch.durationSeconds++;
          const durationEl = document.getElementById('live-duration-counter');
          if (durationEl) {
            durationEl.innerText = formatDuration(AppState.todayPunch.durationSeconds);
          }
        }
      }, 1000);
    }
    startPunchTimer();

    function formatDuration(sec) {
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      return `${String(h).padStart(2, '0')}h ${String(m).padStart(2, '0')}m ${String(s).padStart(2, '0')}s`;
    }

    function showToast(title, message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const icons = {
        success: 'fa-circle-check text-emerald-500',
        info: 'fa-circle-info text-indigo-500',
        warning: 'fa-triangle-exclamation text-amber-500',
        error: 'fa-circle-exclamation text-rose-500'
      };
      
      toast.className = 'pointer-events-auto flex items-start gap-3 bg-white p-3.5 rounded-xl shadow-lg border border-slate-100 max-w-sm transition-all duration-300 transform translate-y-2 opacity-0';
      toast.innerHTML = `
        <i class="fa-solid ${icons[type] || icons.info} text-lg mt-0.5"></i>
        <div class="flex-1 text-xs">
          <p class="font-bold text-slate-800">${title}</p>
          <p class="text-slate-600 mt-0.5">${message}</p>
        </div>
      `;
      container.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      });

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    // Attendance Punch Action
    function toggleAttendancePunch() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      
      if (!AppState.todayPunch.punchedIn) {
        AppState.todayPunch.punchedIn = true;
        AppState.todayPunch.punchInTime = timeStr;
        AppState.todayPunch.punchOutTime = null;
        AppState.todayPunch.isTimerRunning = true;
        showToast("Punched In Successfully", `Marked present at ${timeStr}. Live session active.`, "success");
      } else {
        AppState.todayPunch.punchedIn = false;
        AppState.todayPunch.punchOutTime = timeStr;
        AppState.todayPunch.isTimerRunning = false;
        showToast("Punched Out Successfully", `Marked exit at ${timeStr}. Total time logged.`, "warning");
      }
      renderApp();

      `;
    }

    // Helper for Calendar Days
    function generateMockCalendarDays() {
      // September 2026 starts on Tuesday (offset 2 empty days)
      const offset = 2; 
      const totalDays = 30;
      let html = '';

      // Offset padding
      for (let i = 0; i < offset; i++) {
        html += `<div class="p-2 border-b border-r border-slate-100 bg-slate-50/50"></div>`;
      }

      for (let day = 1; day <= totalDays; day++) {
        const dayOfWeek = (offset + day - 1) % 7;
        const isSunday = dayOfWeek === 0;
        const isSaturday = dayOfWeek === 6;
        
        let badgeClass = 'bg-emerald-50 text-emerald-700 border-emerald-200';
        let statusLabel = 'Present';

        if (isSunday || isSaturday) {
          badgeClass = 'bg-slate-100 text-slate-400 border-slate-200';
          statusLabel = 'Off';
        } else if (day === 8) {
          badgeClass = 'bg-rose-50 text-rose-600 border-rose-200';
          statusLabel = 'Absent';
        } else if (day === 14) {
          badgeClass = 'bg-amber-50 text-amber-700 border-amber-200';
          statusLabel = '0.5 Day';
        } else if (day === 20) {
          badgeClass = 'bg-indigo-50 text-indigo-700 border-indigo-200';
          statusLabel = 'Today';
        } else if (day > 20 && !isSunday && !isSaturday) {
          badgeClass = 'bg-slate-50 text-slate-400 border-dashed border-slate-200';
          statusLabel = 'Scheduled';
        }

        html += `
          <div class="p-1.5 sm:p-2.5 border-b border-r border-slate-100 min-h-[58px] flex flex-col justify-between hover:bg-slate-50 transition cursor-default">
            <span class="font-bold text-xs ${day === 20 ? 'text-indigo-600 font-extrabold' : 'text-slate-700'}">${day}</span>
            <span class="text-[9px] px-1 py-0.5 rounded border ${badgeClass} font-semibold truncate">
              ${statusLabel}
            </span>
          </div>
        `;
      }
      return html;
    }
  </script>

            <div class="p-4 sm:p-5 border-b border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
              <div>
                <h3 class="font-bold text-slate-900 text-sm sm:text-base">Active Manpower Roster (${AppState.employees.length} Staff)</h3>
                <p class="text-xs text-slate-500">Current shift statuses and direct communication links.</p>
              </div>

              <div class="flex items-center gap-2">
                <span class="text-xs bg-emerald-50 text-emerald-700 font-bold px-2 py-1 rounded-lg">
                  Present: ${AppState.employees.filter(e => e.status === 'Present').length}
                </span>
                <span class="text-xs bg-amber-50 text-amber-700 font-bold px-2 py-1 rounded-lg">
                  Leave: ${AppState.employees.filter(e => e.status === 'On Leave').length}
                </span>
              </div>
            </div>

            <div class="overflow-x-auto text-xs">
              <table class="w-full text-left">
                <thead class="bg-slate-50 text-slate-500 uppercase tracking-wider font-semibold border-b border-slate-100">
                  <tr>
                    <th class="p-3.5">Employee Name & ID</th>
                    <th class="p-3.5">Role & Department</th>
                    <th class="p-3.5">Status</th>
                    <th class="p-3.5">Punch In</th>
                    <th class="p-3.5 text-right">Quick Contact</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${AppState.employees.map(emp => `
                    <tr class="hover:bg-slate-50/70 transition">
                      <td class="p-3.5 flex items-center gap-3">
                        <img src="${emp.avatar}" class="w-8 h-8 rounded-full object-cover border border-slate-200" alt="">
                        <div>
                          <p class="font-bold text-slate-900">${emp.name}</p>
                          <p class="font-mono text-[10px] text-indigo-600 font-semibold">${emp.id}</p>
                        </div>
                      </td>
                      <td class="p-3.5">
                        <p class="font-semibold text-slate-800">${emp.designation}</p>
                        <p class="text-[10px] text-slate-500">${emp.department}</p>
                      </td>
                      <td class="p-3.5">
                        <span class="px-2.5 py-1 rounded-full text-[10px] font-bold ${
                          emp.status === 'Present' ? 'bg-emerald-100 text-emerald-800' :
                          emp.status === 'On Leave' ? 'bg-rose-100 text-rose-800' :
                          emp.status === 'Late' ? 'bg-amber-100 text-amber-800' : 'bg-slate-100 text-slate-700'
                        }">
                          ${emp.status}
                        </span>
                      </td>
                      <td class="p-3.5 font-mono text-slate-700">
                        ${emp.punchIn}
                      </td>
                      <td class="p-3.5 text-right">
                        <div class="inline-flex items-center gap-1.5">
                          <button onclick="launchDirectStaffWhatsApp('${emp.whatsapp}', '${emp.name}')" title="WhatsApp Message" class="w-7 h-7 bg-emerald-50 text-emerald-600 hover:bg-emerald-600 hover:text-white rounded-lg flex items-center justify-center transition">
                            <i class="fa-brands fa-whatsapp text-sm"></i>
                          </button>
                          <button onclick="pingStaffInChat('${emp.name}')" title="Team Chat Ping" class="w-7 h-7 bg-indigo-50 text-indigo-600 hover:bg-indigo-600 hover:text-white rounded-lg flex items-center justify-center transition">
                            <i class="fa-regular fa-comment-dots text-sm"></i>
                          </button>
                        </div>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>

        </div>
      `;
    }

    // Handlers for Manpower
    function approveLeave(leaveId) {
      const target = AppState.leaveRequests.find(l => l.id === leaveId);
      if (target) {
        target.status = 'Approved';
        showToast("Leave Approved", `Approved leave request for ${target.empName}.`, "success");
        renderApp();
      }
    }

    function rejectLeave(leaveId) {
      const target = AppState.leaveRequests.find(l => l.id === leaveId);
      if (target) {
        target.status = 'Rejected';
        showToast("Leave Rejected", `Declined leave request for ${target.empName}.`, "warning");
        renderApp();
      }
    }

    function handleCreateEmployee(e) {
      e.preventDefault();
      const name = document.getElementById('new-emp-name').value;
      const role = document.getElementById('new-emp-role').value;
      const dept = document.getElementById('new-emp-dept').value;
      const phone = document.getElementById('new-emp-phone').value;
      const whatsapp = document.getElementById('new-emp-whatsapp').value.replace(/\D/g, '');
      const shift = document.getElementById('new-emp-shift').value;

      const generatedId = `EMP-${Math.floor(1007 + AppState.employees.length)}`;

      const newEmp = {
        id: generatedId,
        name: name,
        role: role,
        designation: `${dept} Specialist`,
        department: dept,
        phone: phone,
        whatsapp: whatsapp || '919800000000',
        status: 'Checked Out',
        punchIn: '-',
        punchOut: '-',
        avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=200&q=80',
        shift: shift
      };

      AppState.employees.unshift(newEmp);
      showToast("Employee Enrolled", `Generated ID ${generatedId} for ${name}. Added to manpower database.`, "success");
      renderApp();
    }

    function launchDirectStaffWhatsApp(phone, name) {
      const cleanPhone = phone.replace(/\D/g, '');
      const msg = encodeURIComponent(`Hi ${name}, this is manager message regarding today's shift and attendance record.`);
      const url = `https://wa.me/${cleanPhone}?text=${msg}`;
      window.open(url, '_blank');
    }

    function pingStaffInChat(name) {
      toggleChatDrawer();
      const chatInput = document.getElementById('chat-input');
      if (chatInput) {
        chatInput.value = `@${name}: `;
        chatInput.focus();
      }
    }
  </script>

  <script>
    function getProfileSecurityHtml() {
      const u = AppState.currentUser;
      return `
        <div class="max-w-3xl mx-auto space-y-6 animate-in fade-in duration-300">
          
          <!-- Identity Summary Card -->
          <div class="bg-white rounded-3xl p-6 border border-slate-200 custom-shadow flex flex-col sm:flex-row items-center gap-5">
            <div class="relative">
              <img src="${u.avatar}" class="w-24 h-24 rounded-3xl object-cover border-2 border-indigo-500 shadow-md" alt="">
              <span class="absolute -bottom-1 -right-1 bg-emerald-500 text-white text-[10px] px-2 py-0.5 rounded-full font-bold">ACTIVE</span>
            </div>
            <div class="text-center sm:text-left space-y-1 flex-1">
              <div class="flex flex-col sm:flex-row sm:items-center gap-2">
                <h2 class="text-xl font-bold text-slate-900">${u.name}</h2>
                <span class="font-mono text-xs px-2.5 py-0.5 rounded-full bg-indigo-100 text-indigo-700 font-bold self-center sm:self-auto">${u.id}</span>
              </div>
              <p class="text-xs text-slate-600 font-semibold">${u.designation} &bull; ${u.department}</p>
              <p class="text-[11px] text-slate-400">Date of Joining: ${u.joiningDate} &bull; Shift: ${u.shift}</p>
            </div>
          </div>

          <!-- Personal Information Editor -->
          <div class="bg-white rounded-3xl p-6 border border-slate-200 custom-shadow space-y-4">
            <div class="border-b border-slate-100 pb-3">
              <h3 class="font-bold text-slate-900 text-sm sm:text-base">Personal Contact & Corporate Record</h3>
              <p class="text-xs text-slate-500">Keep your emergency and WhatsApp contact updated for HR dispatches.</p>
            </div>

            <form onsubmit="handleUpdateProfile(event)" class="space-y-4 text-xs">
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label class="block font-semibold text-slate-700 mb-1">Email Address</label>
                  <input type="email" id="prof-email" value="${u.email}" required class="w-full p-2.5 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div>
                  <label class="block font-semibold text-slate-700 mb-1">Mobile Phone Number</label>
                  <input type="tel" id="prof-phone" value="${u.phone}" required class="w-full p-2.5 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label class="block font-semibold text-slate-700 mb-1">Corporate Department</label>
                  <input type="text" readonly value="${u.department}" class="w-full p-2.5 bg-slate-100 text-slate-500 border rounded-xl cursor-not-allowed">
                </div>

                <div>
                  <label class="block font-semibold text-slate-700 mb-1">Assigned Shift Schedule</label>
                  <input type="text" readonly value="${u.shift}" class="w-full p-2.5 bg-slate-100 text-slate-500 border rounded-xl cursor-not-allowed">
                </div>
              </div>

              <button type="submit" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow transition">
                Save Profile Changes
              </button>
            </form>
          </div>

          <!-- Change Password Module -->
          <div class="bg-white rounded-3xl p-6 border border-slate-200 custom-shadow space-y-4">
            <div class="border-b border-slate-100 pb-3">
              <h3 class="font-bold text-slate-900 text-sm sm:text-base">Change Password & Account Security</h3>
              <p class="text-xs text-slate-500">Ensure password has at least 8 characters with numbers and symbols.</p>
            </div>

            <form onsubmit="handleChangePassword(event)" class="space-y-4 text-xs">
              <div>
                <label class="block font-semibold text-slate-700 mb-1">Current Password</label>
                <input type="password" id="old-pass" required placeholder="••••••••" class="w-full p-2.5 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500">
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label class="block font-semibold text-slate-700 mb-1">New Password</label>
                  <input type="password" id="new-pass" required placeholder="Enter new strong password" class="w-full p-2.5 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div>
                  <label class="block font-semibold text-slate-700 mb-1">Confirm New Password</label>
                  <input type="password" id="confirm-pass" required placeholder="Repeat new password" class="w-full p-2.5 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
              </div>

              <button type="submit" class="px-5 py-2.5 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-xl shadow transition">
                Update Password
              </button>
            </form>
          </div>

        </div>
      `;
    }

    function handleUpdateProfile(e) {
      e.preventDefault();
      const email = document.getElementById('prof-email').value;
      const phone = document.getElementById('prof-phone').value;
      
      AppState.currentUser.email = email;
      AppState.currentUser.phone = phone;
      
      showToast("Profile Updated", "Your contact details have been successfully synced.", "success");
      renderApp();
    }

    function handleChangePassword(e) {
      e.preventDefault();
      const newP = document.getElementById('new-pass').value;
      const confP = document.getElementById('confirm-pass').value;

      if (newP !== confP) {
        showToast("Password Mismatch", "The new passwords you entered do not match.", "error");
        return;
      }
      if (newP.length < 6) {
        showToast("Weak Password", "Please choose a password with at least 6 characters.", "warning");
        return;
      }

      showToast("Security Updated", "Your password has been changed successfully.", "success");
      document.getElementById('old-pass').value = '';
      document.getElementById('new-pass').value = '';
      document.getElementById('confirm-pass').value = '';
    }

    // Notifications Center View
    function getNotificationsViewHtml() {
      return `
        <div class="max-w-3xl mx-auto space-y-4 animate-in fade-in duration-300">
          <div class="flex items-center justify-between bg-white p-4 rounded-2xl border border-slate-200">
            <div>
              <h2 class="font-bold text-slate-900 text-sm sm:text-base">System Notification Center</h2>
              <p class="text-xs text-slate-500">Action items, policy alerts and leave updates.</p>
            </div>
            <button onclick="markAllNotificationsRead()" class="text-xs font-semibold text-indigo-600 hover:underline">
              Mark all as read
            </button>
          </div>

          <div class="space-y-2.5">
            ${AppState.notifications.map(n => `
              <div class="p-4 rounded-2xl border transition flex items-start gap-3.5 ${n.read ? 'bg-white border-slate-200' : 'bg-indigo-50/50 border-indigo-200'}">
                <div class="w-9 h-9 rounded-xl bg-indigo-100 text-indigo-600 flex items-center justify-center text-sm">
                  <i class="fa-solid ${n.icon}"></i>
                </div>
                <div class="flex-1 text-xs">
                  <div class="flex items-center justify-between">
                    <h4 class="font-bold text-slate-900">${n.title}</h4>
                    <span class="text-[10px] text-slate-400">${n.time}</span>
                  </div>
                  <p class="text-slate-600 mt-0.5">${n.desc}</p>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function markAllNotificationsRead() {
      AppState.notifications.forEach(n => n.read = true);
      showToast("Cleared", "All notifications marked as read.", "info");
      renderApp();
    }
  </script>

  <script>
    function openWhatsAppModal() {
      document.getElementById('whatsapp-modal').classList.remove('hidden');
    }

    function closeWhatsAppModal() {
      document.getElementById('whatsapp-modal').classList.add('hidden');
    }

    function setWaTemplate(type) {
      const msgInput = document.getElementById('wa-message');
      if (type === 'punch') {
        msgInput.value = "WorkPulse Reminder: Please ensure you punch in for your scheduled morning shift before 10:00 AM to prevent late penalty.";
      } else if (type === 'leave') {
        msgInput.value = "Great news! Your requested leave of absence has been officially approved by the Operations Manager.";
      } else if (type === 'holiday') {
        msgInput.value = "Upcoming Holiday Notification: The office and operations hub will remain closed on Friday for Gandhi Jayanti.";
      } else if (type === 'meeting') {
        msgInput.value = "Urgent: Operations manpower briefing starting in 15 minutes at Conference Room B or via remote link.";
      }
    }

    function sendDirectWhatsApp() {
      const rawPhone = document.getElementById('wa-phone').value.replace(/\D/g, '');
      const msg = encodeURIComponent(document.getElementById('wa-message').value);
      
      if (!rawPhone) {
        showToast("Phone Required", "Please enter a valid mobile number.", "warning");
        return;
      }

      const waUrl = `https://wa.me/${rawPhone}?text=${msg}`;
      window.open(waUrl, '_blank');
      closeWhatsAppModal();
      showToast("WhatsApp Opened", "Forwarded template to your WhatsApp application.", "success");
    }

    function sendSimulatedTeamChat() {
      const msg = document.getElementById('wa-message').value;
      AppState.chatMessages.push({
        sender: AppState.currentUser.name,
        text: msg,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        self: true
      });
      closeWhatsAppModal();
      toggleChatDrawer(true);
      renderChatMessages();
      showToast("Dispatched", "Message broadcasted to in-app team manpower chat.", "info");
    }

    // In-App Chat Window Logic
    function toggleChatDrawer(forceOpen = false) {
      const drawer = document.getElementById('chat-drawer');
      if (forceOpen) {
        drawer.classList.remove('hidden');
      } else {
        drawer.classList.toggle('hidden');
      }
      if (!drawer.classList.contains('hidden')) {
        renderChatMessages();
      }
    }

    function renderChatMessages() {
      const container = document.getElementById('chat-messages');
      if (!container) return;
      
      container.innerHTML = AppState.chatMessages.map(m => `
        <div class="flex flex-col ${m.self ? 'items-end' : 'items-start'}">
          <span class="text-[10px] text-slate-400 mb-0.5">${m.sender} &bull; ${m.time}</span>
          <div class="max-w-[85%] p-2.5 rounded-2xl text-xs ${m.self ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-white text-slate-800 border border-slate-200 rounded-bl-none shadow-sm'}">
            ${m.text}
          </div>
        </div>
      `).join('');
      container.scrollTop = container.scrollHeight;
    }

    function handleSendChatMessage(e) {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;

      AppState.chatMessages.push({
        sender: AppState.currentUser.name,
        text: text,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        self: true
      });

      input.value = '';
      renderChatMessages();
    }

    // Initialize application on load
    window.addEventListener('DOMContentLoaded', () => {
      renderApp();
    });
  </script>
</body>
</html>
